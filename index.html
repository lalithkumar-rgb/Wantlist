:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Helvetica,Arial,sans-serif}

.sectionhead h2{font-size:23px}.pagehead h1{font-size:30px}

.navbtn.active{color:var(--green2)}.navbtn.add{background:var(--green2);color:white}
.detailbar,.formhead{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:18;background:var(--bg);padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

.backbtn span{font-size:27px;line-height:16px}

.compactform .choice button.selected{background:var(--soft);border-color:var(--green2);color:var(--green)}

.morebody{padding-bottom:8px}.morebody label{margin-top:16px}.morebody .field{font-size:14px}

.detailbar .iconbtn{width:38px;height:38px}
.app[data-page="form"],.app[data-page="detail"]{padding-bottom:30px}

function safeHttpUrl(v){try{let u=new URL(String(v||""));return (u.protocol==="https:"||u.protocol==="http:")?u.href:""}catch(_){return ""}}
let dbPromise;
function openDB(){if(!("indexedDB" in window))return Promise.reject(new Error("IndexedDB unavailable"));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{let req=indexedDB.open("WANTLIST_DB",1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains("items"))db.createObjectStore("items",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function loadDB(){let db=await openDB();return new Promise((resolve,reject)=>{let req=db.transaction("items","readonly").objectStore("items").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
async function save(){try{let db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction("items","readwrite"),store=tx.objectStore("items");store.clear();items.forEach(x=>store.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){try{localStorage.setItem("wantlist_items_fallback",JSON.stringify(items))}catch(_){toast("Storage is full. Export a backup and remove large photos.")}}}
async function initialiseData(){try{let stored=await loadDB();if(stored.length){items=stored}else{let legacy=JSON.parse(localStorage.getItem("wantlist_items")||"null")||JSON.parse(localStorage.getItem("wantlist_items_fallback")||"null");items=legacy||seed;await save()}localStorage.removeItem("wantlist_items")}catch(e){let fallback=JSON.parse(localStorage.getItem("wantlist_items_fallback")||"null");items=fallback||seed}render()}

function applyTheme(){let dark=theme==="dark"||(theme==="adaptive"&&matchMedia("(prefers-color-scheme: dark)").matches);let palette=THEME_PALETTES[selectedTheme]||THEME_PALETTES.alpine;let colors=dark?palette.dark:palette.light;document.documentElement.dataset.theme=dark?"dark":"light";for(let [key,value] of Object.entries(colors))document.documentElement.style.setProperty("--"+({"solid":"surface-solid"}[key]||key),value);document.querySelector('meta[name="theme-color"]').content=colors.bg;document.documentElement.style.setProperty("--journey-image",`url("${THEME_OPTIONS[selectedTheme].images[1].url}")`);document.documentElement.style.setProperty("--progress-image",`url("${THEME_OPTIONS[selectedTheme].images[2].url}")`)}
function setVisualTheme(key){if(!THEME_OPTIONS[key])return;selectedTheme=key;HEROES=THEME_OPTIONS[key].images;heroIndex=0;localStorage.setItem("wantlist_visual_theme",key);applyTheme();closeModal();render();toast(THEME_OPTIONS[key].name+" theme selected")}

function toast(t){let el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2100)}

function home(){

 <section class="summary"><div class="ring" style="--progress:${progress()*3.6}deg"><b>${progress()}%</b></div><div class="metric"><strong>${bought().length} of ${items.length}</strong><small>Acquired</small></div><div class="metric"><strong>${money(totalActual())}</strong><small>Total invested</small></div></section>

 `;
}
function card(x){return `<article class="asp-card" onclick="openDetail('${x.id}')"><img src="${esc(x.aspirationImage||x.productImage||HEROES[0].url)}" onerror="this.src='${HEROES[0].url}'"><div class="pad"><strong>${esc(x.name)}</strong><small>${esc(x.category)} · ${x.budget?money(x.budget):x.priority+" priority"}</small></div></article>`}
function list(){
 $("#view").innerHTML=`<div class="pagehead"><div><h1>My List</h1><p>Everything you're looking forward to.</p></div><button class="iconbtn" onclick="openSettings()">···</button></div>
 <div style="padding:0 22px 12px"><input class="field" id="search" placeholder="⌕  Search your list" value="${esc(searchTerm)}" oninput="searchTerm=this.value;applyListFilters()"></div>
 <div class="filterrow">${["All","To Buy","Purchased"].map(f=>`<button class="pill ${filter===f?'active':''}" onclick="filter='${f}';render()">${f} · ${f==="All"?items.length:f==="To Buy"?todo().length:bought().length}</button>`).join("")}</div>
 <div class="filterrow" style="padding-top:0"><select class="field" id="categoryFilter" style="max-width:210px;padding:9px 12px" onchange="applyListFilters()"><option value="">All collections</option>${["Home","Tech & Gadgets","Travel","Personal","Vehicles","Photography","Miscellaneous"].map(c=>`<option>${c}</option>`).join("")}</select><select class="field" id="sortFilter" style="max-width:150px;padding:9px 12px" onchange="applyListFilters()"><option value="priority">Priority</option><option value="recent">Recently added</option><option value="price">Budget</option><option value="az">A to Z</option></select></div>
 <div class="itemlist" id="itemsContainer"></div>`;

}
function applyListFilters(){let c=$("#categoryFilter")?.value||"",s=$("#sortFilter")?.value||"priority";let arr=items.filter(x=>(filter==="All"||x.status===filter)&&(!c||x.category===c)&&x.name.toLowerCase().includes(searchTerm.toLowerCase()));arr.sort((a,b)=>s==="az"?a.name.localeCompare(b.name):s==="recent"?new Date(b.added)-new Date(a.added):s==="price"?(+b.budget||0)-(+a.budget||0):({High:0,Soon:1,Someday:2}[a.priority]-({High:0,Soon:1,Someday:2}[b.priority])));$("#itemsContainer").innerHTML=arr.length?arr.map(x=>`<div class="itemrow ${x.status==='Purchased'?'purchased':''}"><img class="thumb" src="${esc(x.aspirationImage||x.productImage||HEROES[0].url)}" onerror="this.src='${HEROES[0].url}'" onclick="openDetail('${x.id}')"><div class="iteminfo" onclick="openDetail('${x.id}')"><strong>${esc(x.name)}</strong><small>${esc(x.category)}${x.budget?" · "+money(x.budget):""}</small><span class="priority">${esc(x.priority)} priority</span></div><button class="check ${x.status==='Purchased'?'done':''}" aria-label="Toggle acquired" onclick="event.stopPropagation();togglePurchased('${x.id}')">${x.status==='Purchased'?'✓':''}</button></div>`).join(""):'<div class="empty"><b>Room for something wonderful.</b>No items match this view. Add an item whenever you are ready.</div>'}

extlink" style="color:#a45f55" onclick="deleteItem('${x.id}')">Delete item</button></div></div>`}
function togglePurchased(id){let x=items.find(i=>i.id===id);if(!x)return;if(x.status==="Purchased"){x.status="To Buy";x.purchasedAt="";x.actual=0;toast("Moved back to My List")}else{x.status="Purchased";x.purchasedAt=new Date().toISOString();let v=prompt("Actual amount paid (₹). Leave blank if you don't want to add it yet:","");if(v!==null&&v.trim()!=="")x.actual=Number(v.replace(/[^0-9.]/g,""))||0;toast("Added to My Journey ✨")}save();render()}
function journey(){let arr=bought().slice().sort((a,b)=>new Date(b.purchasedAt||b.added)-new Date(a.purchasedAt||a.added));$("#view").innerHTML=`<div class="journeyhero"><div class="eyebrow">LOOK HOW FAR YOU'VE COME</div><h1>My Journey</h1><div style="font-size:12px;color:#eee">The things you've brought to life.</div></div><div class="stats"><div><strong>${arr.length}</strong><small>Acquired</small></div><div><strong>${money(totalActual())}</strong><small>Total invested</small></div><div><strong>${items.length}</strong><small>Total wishes</small></div></div><div class="sectionhead" style="padding:8px 22px"><h2>Milestones</h2></div><div class="timeline">${arr.length?arr.map(x=>`<div class="timeitem"><img class="mini" src="${esc(x.aspirationImage||x.productImage||HEROES[0].url)}"><div style="flex:1"><strong>${esc(x.name)}</strong><small>${x.purchasedAt?new Date(x.purchasedAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"Date not recorded"}${x.actual?" · "+money(x.actual):""}</small></div><span style="color:var(--green2)">✓</span></div>`).join(""):'<div class="empty"><b>Your first milestone is waiting.</b>When you acquire something from your list, it will be celebrated here.</div>'}</div>`}
function progressPage(){let cats=["Home","Tech & Gadgets","Travel","Personal","Vehicles","Photography","Miscellaneous"];let max=items.length;$("#view").innerHTML=`<div class="pagehead"><div><h1>Progress</h1><p>A closer look at your journey.</p></div></div><div class="progresshero"><div class="big-ring"><div><strong>${progress()}%</strong><small>OVERALL PROGRESS</small></div></div></div><div class="stats"><div><strong>${items.length}</strong><small>Total items</small></div><div><strong>${bought().length}</strong><small>Acquired</small></div><div><strong>${todo().length}</strong><small>To go</small></div></div><div class="section"><div class="sectionhead"><h2>Spend overview</h2></div><div class="panel"><div class="eyebrow" style="color:var(--green2)">TOTAL INVESTED</div><div style="font-family:Georgia,serif;font-size:32px;margin-top:6px">${money(totalActual())}</div><p style="margin-top:5px">Estimated wishlist value: ${money(totalBudget())}</p></div><div class="sectionhead" style="margin-top:25px"><h2>Collection progress</h2></div>${cats.map(c=>{let all=items.filter(x=>x.category===c),done=all.filter(x=>x.status==="Purchased");if(!all.length)return "";let pct=Math.round(done.length/all.length*100);return `<div class="panel"><div style="display:flex;justify-content:space-between;font-size:12px"><strong>${c}</strong><span class="muted">${done.length} of ${all.length} · ${pct}%</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`}).join("")}</div>`}
function openForm(){editId=null;formPriority="Soon";formStatus="To Buy";page="form";render()}
function editItem(id){editId=id;page="form";render()}
function formPage(){
 let x=editId?items.find(i=>i.id===editId):{};
 formPriority=x.priority||"Soon";formStatus=x.status||"To Buy";pendingImage="";
 $("#view").innerHTML=`<div class="pagehead formhead"><div><h1>${editId?"Edit item":"Add item"}</h1><p>Keep it simple. Add details whenever you need them.</p></div><button class="secondary" onclick="${editId?`openDetail('${editId}')`:"navigate('home')"}">Cancel</button></div>
 <form class="form compactform" onsubmit="saveForm(event)">
 <label>Item name *</label><input class="field namefield" name="name" required maxlength="90" placeholder="e.g. Canon camera" value="${esc(x.name||"")}" autocomplete="off">
 <label>Collection</label><select class="field" name="category">${["Home","Tech & Gadgets","Travel","Personal","Vehicles","Photography","Miscellaneous"].map(c=>`<option ${x.category===c?"selected":""}>${c}</option>`).join("")}</select>
 <label>Priority</label><div class="choice">${["High","Soon","Someday"].map(v=>`<button type="button" class="${formPriority===v?"selected":""}" onclick="formPriority='${v}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${v}</button>`).join("")}</div>
 <details class="moreoptions"><summary>More details <span>Budget, link, photos & notes</span></summary><div class="morebody">
 <div class="formrow"><div><label>Estimated budget (₹)</label><input class="field" name="budget" type="number" min="0" step="1" placeholder="Optional" value="${x.budget||""}"></div><div><label>Actual paid (₹)</label><input class="field" name="actual" type="number" min="0" step="1" placeholder="Optional" value="${x.actual||""}"></div></div>
 <label>Product link</label><input class="field" name="link" type="url" placeholder="https://…" value="${esc(x.link||"")}">
 <label>Cover photo</label><select class="field" name="aspirationImage">${Object.entries(CAT_IMAGES).map(([c,u])=>`<option value="${u}" ${(x.aspirationImage||CAT_IMAGES[x.category])===u?"selected":""}>${c} cover</option>`).join("")}${Object.entries(THEME_OPTIONS).map(([k,t])=>`<option value="${t.images[0].url}" ${x.aspirationImage===t.images[0].url?"selected":""}>${t.name} landscape</option>`).join("")}</select>
 <label>Product photo (optional)</label><div class="uploadbox">A photo of the exact product. Stored only on this device.<br><input type="file" name="productImage" accept="image/jpeg,image/png,image/webp" onchange="previewUpload(this)"><div id="uploadPreview" style="margin-top:8px">${x.productImage?'<img src="'+esc(x.productImage)+'" style="width:76px;height:65px;object-fit:cover;border-radius:9px">':""}</div></div>
 <label>Notes</label><textarea class="field" name="notes" placeholder="Optional details…">${esc(x.notes||"")}</textarea>
 ${editId?`<label>Status</label><div class="choice">${["To Buy","Purchased"].map(v=>`<button type="button" class="${formStatus===v?"selected":""}" onclick="formStatus='${v}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${v==="Purchased"?"Acquired":"To Buy"}</button>`).join("")}</div>`:""}
 </div></details>
 <div class="form-submit"><button class="primary" type="submit">${editId?"Save changes":"Add to list"}</button></div></form>`;
}
let pendingImage="";
function previewUpload(input){let f=input.files[0];if(!f)return;if(!["image/jpeg","image/png","image/webp"].includes(f.type)){toast("Choose a JPG, PNG or WebP image");input.value="";return}if(f.size>2.5*1024*1024){toast("Please choose an image under 2.5 MB");input.value="";return}let r=new FileReader();r.onload=()=>{pendingImage=r.result;$("#uploadPreview").innerHTML=`<img src="${pendingImage}" style="width:76px;height:65px;object-fit:cover;border-radius:9px">`};r.readAsDataURL(f)}
function saveForm(e){e.preventDefault();let f=new FormData(e.target),name=f.get("name").trim();if(!name)return;let x=editId?items.find(i=>i.id===editId):{id:"item-"+Date.now(),added:new Date().toISOString(),productImage:""};x.name=name;x.category=f.get("category");x.priority=formPriority;x.budget=Number(f.get("budget"))||0;x.actual=Number(f.get("actual"))||0;x.link=safeHttpUrl(f.get("link"));x.aspirationImage=f.get("aspirationImage");x.notes=f.get("notes");x.status=formStatus;if(x.status==="Purchased"&&!x.purchasedAt)x.purchasedAt=new Date().toISOString();if(x.status!=="Purchased")x.purchasedAt="";if(pendingImage)x.productImage=pendingImage;if(!editId)items.unshift(x);pendingImage="";save();toast(editId?"Changes saved":"Added to your list");page=editId?"detail":"list";selectedId=x.id;render()}
function deleteItem(id){if(!confirm("Delete this item from your list?"))return;items=items.filter(x=>x.id!==id);save();toast("Item deleted");navigate("list")}
function openSettings(){let html=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Your space</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="modalbody"><p class="muted" style="font-size:12px;line-height:1.5">Choose the atmosphere that feels right. Your theme changes the colours, surfaces, navigation and photography throughout the app.</p><div class="themegrid">${Object.entries(THEME_OPTIONS).map(([k,t])=>`<button class="themechoice ${selectedTheme===k?'selected':''}" onclick="setVisualTheme('${k}')"><img src="${t.images[0].url}" alt="${t.name} landscape"><span>${t.name}${selectedTheme===k?' · Selected':''}</span></button>`).join("")}</div><div class="settingsrow"><span>Appearance</span><select class="field" style="width:145px;padding:9px" onchange="theme=this.value;localStorage.setItem('wantlist_theme',theme);applyTheme()"><option value="adaptive" ${theme==="adaptive"?"selected":""}>Adaptive</option><option value="light" ${theme==="light"?"selected":""}>Warm light</option><option value="dark" ${theme==="dark"?"selected":""}>Dark</option></select></div><div class="settingsrow"><span>Export backup</span><button class="secondary" onclick="exportData()">Export JSON</button></div><div class="settingsrow"><span>Restore backup</span><label class="secondary" style="cursor:pointer">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div><div class="settingsrow"><span>Restore original Notes list</span><button class="secondary" onclick="resetSeed()">Restore list</button></div><p class="footnote">Wishlist entries and uploaded product photos are stored in this browser's IndexedDB. Landscape and curated cover photographs load from Unsplash and may need internet the first time. Export a backup before changing devices or clearing browser data.</p></div></div></div>`;$("#modalroot").innerHTML=html}
function closeModal(){$("#modalroot").innerHTML=""}
function exportData(){let blob=new Blob([JSON.stringify({app:"WANTLIST",version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wantlist-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup exported")}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error();if(confirm(`Import ${d.items.length} items? This replaces the current list.`)){items=d.items;save();closeModal();render();toast("Backup restored")}}catch(e){toast("That backup file doesn't look valid")}};r.readAsText(f)}
function resetSeed(){if(!confirm("Restore the original Notes list? Your current changes will be replaced."))return;items=seed;save();closeModal();render();toast("Original list restored")}
let heroTimer=setInterval(()=>{if(page==="home"){heroIndex=(heroIndex+1)%HEROES.length;let el=$(".hero");if(el){let h=HEROES[heroIndex];el.style.setProperty("--hero-image",`url('${h.url}')`);el.querySelector("h1").innerHTML=h.title;el.querySelector("p").textContent=h.sub;el.querySelectorAll(".hero-dots i").forEach((d,i)=>d.classList.toggle("active",i===heroIndex))}}},6500);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
initialiseData();
</script>
</body></html>
