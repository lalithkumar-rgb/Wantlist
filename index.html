["Foldable mattress","Home","Purchased","Someday"],["TV table flames box","Home","To Buy","Soon"],["Travel album","Personal","To Buy","Someday"],["Glasses","Personal","Purchased","Someday"],["Wall clock","Home","To Buy","Soon"],["PC + Monitor for home","Tech & Gadgets","To Buy","High"],["Printer","Tech & Gadgets","To Buy","Soon"],["Aquarium setup","Home","To Buy","Someday"],["Aquatic plants","Home","To Buy","Someday"],["Bike","Vehicles","To Buy","High"],["Selfie stick or stand","Photography","To Buy","Soon"],["DSLR camera","Photography","To Buy","High"],["Dash cam","Vehicles","To Buy","Soon"],["Mobile holder","Vehicles","To Buy","Soon"],["Accessories for seat ventilation","Vehicles","To Buy","Someday"],["Sensor lights","Home","Purchased","Soon"],["Kitchen chair","Home","To Buy","Soon"],["Power bank","Tech & Gadgets","To Buy","Soon"],["Rechargeable lights and fans","Home","To Buy","Soon"],["Window blinders","Home","To Buy","Someday"],["Laptop tool kit","Tech & Gadgets","To Buy","Soon"],["White sneakers","Personal","To Buy","Soon"],["Type C cable","Tech & Gadgets","Purchased","Soon"],["Power bank","Tech & Gadgets","To Buy","Someday"]
].map((x,i)=>({id:"seed-"+i,name:x[0],category:x[1],status:x[2],priority:x[3],budget:0,actual:0,notes:"",link:"",added:new Date(Date.now()-i*86400000).toISOString(),purchasedAt:x[2]==="Purchased"?new Date(Date.now()-(i+1)*86400000).toISOString():"",productImage:"",aspirationImage:PRODUCT_IMAGES[x[0]]||CAT_IMAGES[x[1]]||HEROES[0].url}));
let items=seed;
let theme=localStorage.getItem("wantlist_theme")||"adaptive";
let page="home",filter="All",selectedId=null,editId=null,heroIndex=0,formPriority="Soon",formStatus="To Buy",searchTerm="";
const $=s=>document.querySelector(s);
const money=n=>n?new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(Number(n)):"Not set";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeHttpUrl(v){try{let u=new URL(String(v||""));return (u.protocol==="https:"||u.protocol==="http:")?u.href:""}catch(_){return ""}}
let dbPromise;
function openDB(){if(!("indexedDB" in window))return Promise.reject(new Error("IndexedDB unavailable"));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{let req=indexedDB.open("WANTLIST_DB",1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains("items"))db.createObjectStore("items",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function loadDB(){let db=await openDB();return new Promise((resolve,reject)=>{let req=db.transaction("items","readonly").objectStore("items").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
async function save(){try{let db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction("items","readwrite"),store=tx.objectStore("items");store.clear();items.forEach(x=>store.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){try{localStorage.setItem("wantlist_items_fallback",JSON.stringify(items))}catch(_){toast("Storage is full. Export a backup and remove large photos.")}}}
async function initialiseData(){try{let stored=await loadDB();if(stored.length){items=stored}else{let legacy=JSON.parse(localStorage.getItem("wantlist_items")||"null")||JSON.parse(localStorage.getItem("wantlist_items_fallback")||"null");items=legacy||seed;await save()}localStorage.removeItem("wantlist_items")}catch(e){let fallback=JSON.parse(localStorage.getItem("wantlist_items_fallback")||"null");items=fallback||seed}render()}

const bought=()=>items.filter(x=>x.status==="Purchased");
const todo=()=>items.filter(x=>x.status!=="Purchased");
const totalBudget=()=>items.reduce((a,x)=>a+(+x.budget||0),0);
const totalActual=()=>bought().reduce((a,x)=>a+(+x.actual||0),0);
const progress=()=>items.length?Math.round(bought().length/items.length*100):0;
function applyTheme(){let dark=theme==="dark"||(theme==="adaptive"&&matchMedia("(prefers-color-scheme: dark)").matches);let palette=THEME_OPTIONS[selectedTheme]||THEME_OPTIONS.alpine;let colors=dark?palette.dark:palette.light;document.documentElement.dataset.theme=dark?"dark":"light";document.documentElement.style.setProperty("--bg",colors[0]);document.documentElement.style.setProperty("--green",colors[1]);document.documentElement.style.setProperty("--green2",colors[2]);document.querySelector('meta[name="theme-color"]').content=colors[0]}
function setVisualTheme(key){if(!THEME_OPTIONS[key])return;selectedTheme=key;HEROES=THEME_OPTIONS[key].images;heroIndex=0;localStorage.setItem("wantlist_visual_theme",key);applyTheme();closeModal();render();toast(THEME_OPTIONS[key].name+" theme selected")}

function toast(t){let el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2100)}
function navigate(p){page=p;selectedId=null;render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){applyTheme();document.querySelectorAll(".navbtn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="home")home();if(page==="list")list();if(page==="journey")journey();if(page==="progress")progressPage();if(page==="detail")detail();if(page==="form")formPage()}
function home(){
 const h=HEROES[heroIndex];const cats=["Home","Tech & Gadgets","Travel","Personal"];
 $("#view").innerHTML=`
 <section class="hero" style="--hero-image:url('${h.url}')"><div class="hero-content"><div class="eyebrow">YOUR PERSONAL SPACE</div><h1>${h.title}</h1><p>${h.sub}</p><div class="hero-dots">${HEROES.map((_,i)=>`<i class="${i===heroIndex?'active':''}"></i>`).join("")}</div></div></section>
 <section class="summary"><div class="ring" style="--progress:${progress()*3.6}deg"><b>${progress()}%</b></div><div class="metric"><strong>${bought().length} of ${items.length}</strong><small>Acquired</small></div><div class="metric"><strong>${money(totalActual())}</strong><small>Total invested</small></div></section>
 <section class="section"><div class="sectionhead"><h2>Your collections</h2><button class="textlink" onclick="navigate('list')">See all ↗</button></div><div class="categorygrid">${cats.map(c=>`<button class="category" style="--cat-image:url('${CAT_IMAGES[c]}')" onclick="filter='All';searchTerm='';navigate('list');setTimeout(()=>{let s=$('#categoryFilter');if(s){s.value='${c}';applyListFilters()}},0)"><strong>${esc(c)}</strong><small>${items.filter(x=>x.category===c).length} aspirations</small></button>`).join("")}</div></section>
 <section class="section"><div class="sectionhead"><h2>Up next</h2><button class="textlink" onclick="navigate('list')">View all ↗</button></div><div class="upnext">${todo().slice().sort((a,b)=>({High:0,Soon:1,Someday:2}[a.priority]-({High:0,Soon:1,Someday:2}[b.priority]))).slice(0,5).map(card).join("")||'<div class="empty">Your next chapter is waiting.</div>'}</div></section>`;
}
function card(x){return `<article class="asp-card" onclick="openDetail('${x.id}')"><img src="${esc(x.aspirationImage||x.productImage||HEROES[0].url)}" onerror="this.src='${HEROES[0].url}'"><div class="pad"><strong>${esc(x.name)}</strong><small>${esc(x.category)} · ${x.budget?money(x.budget):x.priority+" priority"}</small></div></article>`}
function list(){
 $("#view").innerHTML=`<div class="pagehead"><div><h1>My List</h1><p>Everything you're looking forward to.</p></div><button class="iconbtn" onclick="openSettings()">···</button></div>
 <div style="padding:0 22px 12px"><input class="field" id="search" placeholder="⌕  Search your aspirations" value="${esc(searchTerm)}" oninput="searchTerm=this.value;applyListFilters()"></div>
 <div class="filterrow">${["All","To Buy","Purchased"].map(f=>`<button class="pill ${filter===f?'active':''}" onclick="filter='${f}';render()">${f} · ${f==="All"?items.length:f==="To Buy"?todo().length:bought().length}</button>`).join("")}</div>
 <div class="filterrow" style="padding-top:0"><select class="field" id="categoryFilter" style="max-width:210px;padding:9px 12px" onchange="applyListFilters()"><option value="">All collections</option>${["Home","Tech & Gadgets","Travel","Personal","Vehicles","Photography","Miscellaneous"].map(c=>`<option>${c}</option>`).join("")}</select><select class="field" id="sortFilter" style="max-width:150px;padding:9px 12px" onchange="applyListFilters()"><option value="priority">Priority</option><option value="recent">Recently added</option><option value="price">Budget</option><option value="az">A to Z</option></select></div>
 <div class="itemlist" id="itemsContainer"></div>`;
 applyListFilters();
}
function applyListFilters(){let c=$("#categoryFilter")?.value||"",s=$("#sortFilter")?.value||"priority";let arr=items.filter(x=>(filter==="All"||x.status===filter)&&(!c||x.category===c)&&x.name.toLowerCase().includes(searchTerm.toLowerCase()));arr.sort((a,b)=>s==="az"?a.name.localeCompare(b.name):s==="recent"?new Date(b.added)-new Date(a.added):s==="price"?(+b.budget||0)-(+a.budget||0):({High:0,Soon:1,Someday:2}[a.priority]-({High:0,Soon:1,Someday:2}[b.priority])));$("#itemsContainer").innerHTML=arr.length?arr.map(x=>`<div class="itemrow ${x.status==='Purchased'?'purchased':''}"><img class="thumb" src="${esc(x.productImage||x.aspirationImage||HEROES[0].url)}" onerror="this.src='${HEROES[0].url}'" onclick="openDetail('${x.id}')"><div class="iteminfo" onclick="openDetail('${x.id}')"><strong>${esc(x.name)}</strong><small>${esc(x.category)}${x.budget?" · "+money(x.budget):""}</small><span class="priority">${esc(x.priority)} priority</span></div><button class="check ${x.status==='Purchased'?'done':''}" aria-label="Toggle acquired" onclick="event.stopPropagation();togglePurchased('${x.id}')">${x.status==='Purchased'?'✓':''}</button></div>`).join(""):'<div class="empty"><b>Room for something wonderful.</b>No items match this view. Add an aspiration whenever you are ready.</div>'}
function openDetail(id){selectedId=id;page="detail";render()}
function detail(){let x=items.find(i=>i.id===selectedId);if(!x){navigate("list");return}$("#view").innerHTML=`<div class="pagehead"><button class="secondary" onclick="navigate('list')">← Back</button><button class="iconbtn" onclick="editItem('${x.id}')">···</button></div><div class="detailhero"><img src="${esc(x.aspirationImage||HEROES[0].url)}" onerror="this.src='${HEROES[0].url}'"></div><div class="detailbody"><div class="eyebrow" style="color:var(--green2)">AN ASPIRATION</div><h1>${esc(x.name)}</h1><div class="detailmeta muted">${esc(x.category)} · ${esc(x.priority)} priority</div>${x.productImage?`<div class="productref"><img src="${esc(x.productImage)}" alt="Product reference"><div><strong style="font-size:12px">Product reference</strong><small>Your specific product photo, kept separate from the aspiration cover.</small></div></div>`:""}<div class="detailgrid"><div class="infobox"><small>Estimated budget</small><strong>${money(x.budget)}</strong></div><div class="infobox"><small>Actual amount</small><strong>${x.actual?money(x.actual):"Not acquired"}</strong></div></div>${safeHttpUrl(x.link)?`<div class="panel"><h3>Product link</h3><a href="${esc(safeHttpUrl(x.link))}" target="_blank" rel="noopener" style="color:var(--green2);font-size:12px;word-break:break-all">${esc(x.link)}</a></div>`:""}${x.notes?`<div class="panel"><h3>A note to myself</h3><p>${esc(x.notes)}</p></div>`:""}${x.status==="Purchased"?`<div class="panel"><h3>Acquired</h3><p>${x.purchasedAt?new Date(x.purchasedAt).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"}):"Purchase date not recorded"}</p></div>`:""}<div style="display:grid;gap:9px;margin-top:20px"><button class="primary" onclick="togglePurchased('${x.id}')">${x.status==="Purchased"?"↶ Move back to My List":"✓ Mark as Acquired"}</button><button class="secondary" onclick="editItem('${x.id}')">Edit aspiration</button></div><div style="text-align:center;margin-top:18px"><button class="textlink" style="color:#a45f55" onclick="deleteItem('${x.id}')">Delete item</button></div></div>`}
function togglePurchased(id){let x=items.find(i=>i.id===id);if(!x)return;if(x.status==="Purchased"){x.status="To Buy";x.purchasedAt="";x.actual=0;toast("Moved back to My List")}else{x.status="Purchased";x.purchasedAt=new Date().toISOString();let v=prompt("Actual amount paid (₹). Leave blank if you don't want to add it yet:","");if(v!==null&&v.trim()!=="")x.actual=Number(v.replace(/[^0-9.]/g,""))||0;toast("Added to My Journey ✨")}save();render()}
function journey(){let arr=bought().slice().sort((a,b)=>new Date(b.purchasedAt||b.added)-new Date(a.purchasedAt||a.added));$("#view").innerHTML=`<div class="journeyhero"><div class="eyebrow">LOOK HOW FAR YOU'VE COME</div><h1>My Journey</h1><div style="font-size:12px;color:#eee">The things you've brought to life.</div></div><div class="stats"><div><strong>${arr.length}</strong><small>Acquired</small></div><div><strong>${money(totalActual())}</strong><small>Total invested</small></div><div><strong>${items.length}</strong><small>Total wishes</small></div></div><div class="sectionhead" style="padding:8px 22px"><h2>Milestones</h2></div><div class="timeline">${arr.length?arr.map(x=>`<div class="timeitem"><img class="mini" src="${esc(x.productImage||x.aspirationImage||HEROES[0].url)}"><div style="flex:1"><strong>${esc(x.name)}</strong><small>${x.purchasedAt?new Date(x.purchasedAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"Date not recorded"}${x.actual?" · "+money(x.actual):""}</small></div><span style="color:var(--green2)">✓</span></div>`).join(""):'<div class="empty"><b>Your first milestone is waiting.</b>When you acquire something from your list, it will be celebrated here.</div>'}</div>`}
function progressPage(){let cats=["Home","Tech & Gadgets","Travel","Personal","Vehicles","Photography","Miscellaneous"];let max=items.length;$("#view").innerHTML=`<div class="pagehead"><div><h1>Progress</h1><p>A closer look at your journey.</p></div></div><div class="progresshero"><div class="big-ring"><div><strong>${progress()}%</strong><small>OVERALL PROGRESS</small></div></div></div><div class="stats"><div><strong>${items.length}</strong><small>Total items</small></div><div><strong>${bought().length}</strong><small>Acquired</small></div><div><strong>${todo().length}</strong><small>To go</small></div></div><div class="section"><div class="sectionhead"><h2>Spend overview</h2></div><div class="panel"><div class="eyebrow" style="color:var(--green2)">TOTAL INVESTED</div><div style="font-family:Georgia,serif;font-size:32px;margin-top:6px">${money(totalActual())}</div><p style="margin-top:5px">Estimated wishlist value: ${money(totalBudget())}</p></div><div class="sectionhead" style="margin-top:25px"><h2>Collection progress</h2></div>${cats.map(c=>{let all=items.filter(x=>x.category===c),done=all.filter(x=>x.status==="Purchased");if(!all.length)return "";let pct=Math.round(done.length/all.length*100);return `<div class="panel"><div style="display:flex;justify-content:space-between;font-size:12px"><strong>${c}</strong><span class="muted">${done.length} of ${all.length} · ${pct}%</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`}).join("")}</div>`}
function openForm(){editId=null;formPriority="Soon";formStatus="To Buy";page="form";render()}
function editItem(id){editId=id;page="form";render()}
function formPage(){let x=editId?items.find(i=>i.id===editId):{};$("#view").innerHTML=`<div class="pagehead"><div><h1>${editId?"Edit aspiration":"A new aspiration"}</h1><p>Give something you're looking forward to a place here.</p></div><button class="secondary" onclick="${editId?`openDetail('${editId}')`:"navigate('home')"}">Cancel</button></div><form class="form" onsubmit="saveForm(event)"><label>What are you looking forward to? *</label><input class="field" name="name" required maxlength="90" placeholder="e.g. A camera of my own" value="${esc(x.name||"")}"><label>Collection</label><select class="field" name="category">${["Home","Tech & Gadgets","Travel","Personal","Vehicles","Photography","Miscellaneous"].map(c=>`<option ${x.category===c?"selected":""}>${c}</option>`).join("")}</select><label>Priority</label><div class="choice">${["High","Soon","Someday"].map(p=>`<button type="button" class="${(x.priority||formPriority)===p?"selected":""}" onclick="formPriority='${p}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${p}</button>`).join("")}</div><div class="formrow"><div><label>Estimated budget (₹)</label><input class="field" name="budget" type="number" min="0" step="1" placeholder="e.g. 55000" value="${x.budget||""}"></div><div><label>Actual paid (₹)</label><input class="field" name="actual" type="number" min="0" step="1" placeholder="Optional" value="${x.actual||""}"></div></div><label>Product link (optional)</label><input class="field" name="link" type="url" placeholder="https://…" value="${esc(x.link||"")}"><label>What does this aspiration look like?</label><select class="field" name="aspirationImage">${Object.entries(CAT_IMAGES).map(([c,u])=>`<option value="${u}" ${(x.aspirationImage||CAT_IMAGES[x.category])===u?"selected":""}>${c} — editorial cover</option>`).join("")}${Object.entries(THEME_OPTIONS).map(([k,t])=>`<option value="${t.images[0].url}" ${x.aspirationImage===t.images[0].url?"selected":""}>${t.name} — landscape cover</option>`).join("")}</select><label>Actual product photograph (optional)</label><div class="uploadbox">Add a photo of the specific product. It stays on this device.<br><input type="file" name="productImage" accept="image/*" onchange="previewUpload(this)"><div id="uploadPreview" style="margin-top:8px">${x.productImage?'<img src="'+esc(x.productImage)+'" style="width:76px;height:65px;object-fit:cover;border-radius:9px">':""}</div></div><label>A note to myself (optional)</label><textarea class="field" name="notes" placeholder="Why does this matter to me? Any details to remember…">${esc(x.notes||"")}</textarea><label>Current status</label><div class="choice">${["To Buy","Purchased"].map(p=>`<button type="button" class="${(x.status||"To Buy")===p?"selected":""}" onclick="formStatus='${p}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${p==="Purchased"?"Acquired":"To Buy"}</button>`).join("")}</div><button class="primary" style="margin-top:24px" type="submit">${editId?"Save changes":"Add to WANTLIST"}</button></form>`;formStatus=x.status||"To Buy"}
let pendingImage="";
function previewUpload(input){let f=input.files[0];if(!f)return;if(f.size>2.5*1024*1024){toast("Please choose an image under 2.5 MB");input.value="";return}let r=new FileReader();r.onload=()=>{pendingImage=r.result;$("#uploadPreview").innerHTML=`<img src="${pendingImage}" style="width:76px;height:65px;object-fit:cover;border-radius:9px">`};r.readAsDataURL(f)}
function saveForm(e){e.preventDefault();let f=new FormData(e.target),name=f.get("name").trim();if(!name)return;let x=editId?items.find(i=>i.id===editId):{id:"item-"+Date.now(),added:new Date().toISOString(),productImage:""};x.name=name;x.category=f.get("category");x.priority=formPriority;x.budget=Number(f.get("budget"))||0;x.actual=Number(f.get("actual"))||0;x.link=safeHttpUrl(f.get("link"));x.aspirationImage=f.get("aspirationImage");x.notes=f.get("notes");x.status=formStatus;if(x.status==="Purchased"&&!x.purchasedAt)x.purchasedAt=new Date().toISOString();if(x.status!=="Purchased")x.purchasedAt="";if(pendingImage)x.productImage=pendingImage;if(!editId)items.unshift(x);pendingImage="";save();toast(editId?"Aspiration updated":"Added to WANTLIST");page=editId?"detail":"list";selectedId=x.id;render()}
function deleteItem(id){if(!confirm("Delete this aspiration from WANTLIST?"))return;items=items.filter(x=>x.id!==id);save();toast("Item deleted");navigate("list")}
function openSettings(){let html=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Your space</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="modalbody"><p class="muted" style="font-size:12px;line-height:1.5">Choose the atmosphere that feels right. Your selected landscape theme changes the app colours and rotating home photography.</p><div class="themegrid">${Object.entries(THEME_OPTIONS).map(([k,t])=>`<button class="themechoice ${selectedTheme===k?'selected':''}" onclick="setVisualTheme('${k}')"><img src="${t.images[0].url}" alt="${t.name} landscape"><span>${t.name}${selectedTheme===k?' · Selected':''}</span></button>`).join("")}</div><div class="settingsrow"><span>Appearance</span><select class="field" style="width:145px;padding:9px" onchange="theme=this.value;localStorage.setItem('wantlist_theme',theme);applyTheme()"><option value="adaptive" ${theme==="adaptive"?"selected":""}>Adaptive</option><option value="light" ${theme==="light"?"selected":""}>Warm light</option><option value="dark" ${theme==="dark"?"selected":""}>Dark</option></select></div><div class="settingsrow"><span>Export backup</span><button class="secondary" onclick="exportData()">Export JSON</button></div><div class="settingsrow"><span>Restore backup</span><label class="secondary" style="cursor:pointer">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div><div class="settingsrow"><span>Restore original Notes list</span><button class="secondary" onclick="resetSeed()">Restore list</button></div><p class="footnote">Wishlist entries and uploaded product photos are stored in this browser's IndexedDB. Landscape and curated cover photographs load from Unsplash and may need internet the first time. Export a backup before changing devices or clearing browser data.</p></div></div></div>`;$("#modalroot").innerHTML=html}
function closeModal(){$("#modalroot").innerHTML=""}
function exportData(){let blob=new Blob([JSON.stringify({app:"WANTLIST",version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wantlist-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup exported")}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error();if(confirm(`Import ${d.items.length} items? This replaces the current list.`)){items=d.items;save();closeModal();render();toast("Backup restored")}}catch(e){toast("That backup file doesn't look valid")}};r.readAsText(f)}
function resetSeed(){if(!confirm("Restore the original Notes list? Your current changes will be replaced."))return;items=seed;save();closeModal();render();toast("Original list restored")}
let heroTimer=setInterval(()=>{if(page==="home"){heroIndex=(heroIndex+1)%HEROES.length;let el=$(".hero");if(el){let h=HEROES[heroIndex];el.style.setProperty("--hero-image",`url('${h.url}')`);el.querySelector("h1").innerHTML=h.title;el.querySelector("p").textContent=h.sub;el.querySelectorAll(".hero-dots i").forEach((d,i)=>d.classList.toggle("active",i===heroIndex))}}},6500);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
initialiseData();
</script>
